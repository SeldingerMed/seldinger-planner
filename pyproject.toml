[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "seldinger-planner"
version = "0.1.0"
description = "New CTA aneurysm planning prototype"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<1", "python-dotenv>=1,<2", "jsonschema>=4,<5", "fastapi>=0.115,<1", "uvicorn>=0.34,<1"]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=8,<10",
    "ruff>=0.11,<1",
]

[tool.setuptools]
packages = ["planner"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
