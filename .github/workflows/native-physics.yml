name: Native numerical checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  native-physics:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SELDINGER_RUN_MODEL_TESTS: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: '0.13.5'
          python-version: '3.11'
      - run: uv venv --python 3.11 .runtime/physics-runtime
      - run: uv pip sync --python .runtime/physics-runtime/bin/python --require-hashes requirements/physics.txt
      - run: >-
          .runtime/physics-runtime/bin/python -m pytest -q
          tests/ml_runtime/test_physics_worker.py
          tests/ml_runtime/test_centerline.py
          tests/ml_runtime/test_aneurysm_stokes.py
          tests/ml_runtime/test_aneurysm_stokes_invariants.py
          tests/ml_runtime/test_native_input_guards.py
          tests/ml_runtime/test_rod_contact.py
          tests/ml_runtime/test_lumen_contact.py
          tests/ml_runtime/test_lumen_distance.py
